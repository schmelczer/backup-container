name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install ShellCheck
        run: apt-get update && apt-get install -y shellcheck

      - name: Run ShellCheck
        run: find ./src -name '*.sh' -exec shellcheck {} +
    if: ${{ github.actor != 'renovate-bot' && !startsWith(github.ref, 'refs/heads/renovate/') && !startsWith(github.head_ref, 'renovate/') }}
