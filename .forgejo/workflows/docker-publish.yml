name: Docker

on:
  push:
    branches: ["main"]
    tags: ['v*.*.*']
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: docker
    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and publish image
        uses: https://git.schmelczer.dev/andras/ci-actions/docker-publish@18419c79a58572be1bb3759b334f43306be44a29
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          token: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
    if: ${{ github.actor != 'renovate-bot' && !startsWith(github.ref, 'refs/heads/renovate/') && !startsWith(github.head_ref, 'renovate/') }}
